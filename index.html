<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niv Imber - Career Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .hebrew-font { font-family: 'Assistant', sans-serif; }
        [contenteditable="true"] { outline: 1px dashed #3b82f6; outline-offset: 2px; background-color: rgba(239, 246, 255, 0.5); border-radius: 2px; }
        .cv-bubble { display: inline-block; padding: 4px 10px; background-color: white; border: 1px solid #e2e8f0; color: #334155; border-radius: 6px; font-size: 10px; font-weight: 500; margin: 2px; white-space: nowrap; }
        @media print { .no-print { display: none !important; } .resume-page { box-shadow: none !important; margin: 0 !important; width: 100% !important; } }
        .resume-page { background: white; width: 210mm; min-height: 297mm; margin: 1rem auto; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .tab-active { border-bottom: 2px solid #1e293b; color: #1e293b; font-weight: 600; }
        #auth-screen { position: fixed; inset: 0; background: #0f172a; z-index: 1000; display: flex; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="text-center p-8 bg-slate-800 rounded-3xl shadow-2xl max-w-sm w-full border border-slate-700">
            <h1 class="text-2xl font-bold mb-2">Private Dashboard</h1>
            <p class="text-slate-400 text-sm mb-8">Niv Imber's Career Management</p>
            <button onclick="window.handleLogin()" class="w-full bg-white text-slate-900 font-bold py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-slate-100 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5 h-5"> Sign in with Google
            </button>
            <div id="auth-error" class="mt-4 text-red-400 text-xs hidden"></div>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <div class="no-print bg-slate-900 text-white p-3 sticky top-0 z-[60] flex justify-between items-center px-6">
            <div class="flex items-center gap-6">
                <h1 class="font-bold">CAREER DASHBOARD</h1>
                <nav class="flex gap-2 text-sm bg-slate-800 p-1 rounded-lg">
                    <button onclick="switchView('cv')" class="px-4 py-1 rounded hover:bg-slate-700 transition">CV Manager</button>
                    <button onclick="switchView('tracker')" class="px-4 py-1 rounded hover:bg-slate-700 transition">Tracker</button>
                </nav>
            </div>
            <div class="flex items-center gap-4 text-xs">
                <span id="user-display"></span>
                <button onclick="window.handleLogout()" class="underline opacity-50 hover:opacity-100">Logout</button>
                <button onclick="window.print()" class="bg-blue-600 px-3 py-1.5 rounded font-bold">Print PDF</button>
            </div>
        </div>

        <div id="cv-toolbar" class="no-print bg-white border-b sticky top-[52px] z-50 p-2 flex flex-col items-center gap-2">
            <div class="max-w-6xl w-full flex justify-between items-center px-4">
                <div id="cv-tabs" class="flex gap-4 overflow-x-auto"></div>
                <div class="flex gap-2">
                    <button onclick="showImportModal()" class="text-xs font-bold px-3 py-1.5 bg-purple-50 text-purple-700 rounded border">Import AI</button>
                    <button onclick="addNewCV()" class="text-xs font-bold px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded border">+ New</button>
                    <button onclick="deleteCurrentCV()" class="text-xs font-bold px-3 py-1.5 bg-red-50 text-red-700 rounded border">Delete</button>
                    <button onclick="toggleEditMode()" id="edit-toggle" class="text-xs font-bold px-3 py-1.5 bg-gray-100 rounded border">Edit Mode: OFF</button>
                </div>
            </div>
            <div id="formatting-toolbar" class="hidden flex gap-4 bg-gray-50 p-2 rounded-full border shadow-inner">
                <div class="flex gap-2 border-r pr-4">
                    <button onclick="format('bold')" class="font-bold w-6">B</button>
                    <button onclick="format('underline')" class="underline w-6">U</button>
                    <button onclick="applyStyle('fontSize', '14px')" class="text-xs font-bold">Size: M</button>
                </div>
                <div class="flex gap-4">
                    <button onclick="applyBubble()" class="bg-slate-900 text-white text-[10px] px-3 py-1 rounded-full font-bold">Make Bubble</button>
                    <button onclick="switchLanguage('en')" class="text-[10px] font-bold">ENG</button>
                    <button onclick="switchLanguage('he')" class="text-[10px] font-bold">HEB</button>
                </div>
            </div>
        </div>

        <div id="tracker-container" class="hidden p-8 max-w-6xl mx-auto">
            <h2 class="text-2xl font-bold mb-6">Job Tracker</h2>
            <div class="bg-white rounded-xl shadow overflow-hidden border">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 border-b text-[10px] uppercase font-bold text-slate-400">
                        <tr><th class="p-4">Company</th><th class="p-4">Applied</th><th class="p-4">Status</th></tr>
                    </thead>
                    <tbody id="jobs-list"></tbody>
                </table>
            </div>
        </div>

        <div id="resume-container"></div>
    </div>

    <div id="import-modal" class="hidden fixed inset-0 bg-slate-900/50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-xl">
            <h3 class="font-bold mb-4 text-lg">Import Tailored JSON</h3>
            <textarea id="ai-json-input" rows="8" class="w-full p-4 border rounded-lg bg-slate-50 font-mono text-xs mb-4"></textarea>
            <div class="flex gap-2">
                <button onclick="handleAIImport()" class="flex-1 bg-purple-600 text-white py-2 rounded-lg font-bold">Import</button>
                <button onclick="copySchemaPrompt()" class="bg-slate-100 px-4 py-2 rounded-lg font-bold text-xs">Copy Prompt</button>
                <button onclick="hideImportModal()" class="px-4 py-2 font-bold text-xs border rounded-lg">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIG ---
        // REPLACE THE 'null' BELOW WITH YOUR FIREBASE CONFIG OBJECT
        const firebaseConfig = {
  apiKey: "AIzaSyBe-XeRJTu0nvaJUbL9etf9LteyJ85b-No",
  authDomain: "career-manager-9fc4e.firebaseapp.com",
  projectId: "career-manager-9fc4e",
  storageBucket: "career-manager-9fc4e.firebasestorage.app",
  messagingSenderId: "861677311055",
  appId: "1:861677311055:web:e1fe46c9c6d9b193b7c63a",
  measurementId: "G-6P7TC5DT9N"
}; 
        
        const envConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const config = userConfig || envConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'niv-career-v1';

        if (!config) {
            document.getElementById('auth-error').innerText = "Firebase Configuration Missing. Please follow the instructions to set up your project.";
            document.getElementById('auth-error').classList.remove('hidden');
        }

        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const APPROVED_EMAILS = ["niv.imber@gmail.com","niv2006@gmail.com"];

        const initialContent = {
            en: {
                name: "NIV IMBER", title: "Site Manager | Head of Operations",
                contact_info: `<div class="space-y-1"><div class="flex justify-end gap-2"><span>052-3413683</span><span class="text-slate-300">|</span></div><div class="flex justify-end gap-2"><span>niv.imber@gmail.com</span><span class="text-slate-300">|</span></div><div class="flex justify-end gap-2"><span>Kfar Saba, Israel</span><span class="text-slate-300">|</span></div></div>`,
                profile: `<span style="font-size: 14px;">Dynamic Operations Leader & L.L.B. with over 15 years of experience...</span>`,
                user1st_title: "Israeli Site Manager",
                user1st_points: "<li>Strategic Site Leadership...</li>",
                peninsula_points: "<li>Risk Management...</li>",
                leumi_points: "<li>Financial Analysis...</li>",
                education: `<div class="mb-6"><div class="flex justify-between items-start mb-1"><h3 class="font-bold text-slate-900 text-lg">Academic Center for Law and Science</h3><span class="text-xs text-slate-400 font-bold uppercase">2017–2020</span></div><p class="text-slate-600 text-sm italic">L.L.B. (Bachelor of Laws)</p></div>`,
                expertise: `<span class="cv-bubble">Operations</span>`, tech_stack: "<ul><li>Pipedrive</li></ul>", languages: "<ul><li>Hebrew</li></ul>"
            },
            he: { name: "ניב אימבר", title: "מנהל אופרציה", contact_info: "052-3413683", profile: "", user1st_title: "", user1st_points: "", peninsula_points: "", leumi_points: "", education: "", expertise: "", tech_stack: "", languages: "" }
        };

        window.state = { currentView: 'cv', currentCVID: 0, currentLang: 'en', editMode: false, cvs: [] };

        window.handleLogin = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInWithPopup(auth, provider);
                }
            } catch (err) { alert("Login failed: " + err.message); }
        };

        window.handleLogout = () => signOut(auth).then(() => location.reload());

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email && !APPROVED_EMAILS.includes(user.email)) {
                    alert("Unauthorized Email.");
                    signOut(auth);
                    return;
                }
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('user-display').innerText = user.email || "Preview Mode";
                initData(user.uid);
            }
        });

        function initData(uid) {
            const cvDoc = doc(db, 'artifacts', appId, 'users', uid, 'cv_data', 'main');
            onSnapshot(cvDoc, (snap) => {
                if (snap.exists()) {
                    window.state.cvs = snap.data().cvs;
                    if (window.state.currentCVID === 0) window.state.currentCVID = window.state.cvs[0].id;
                    render();
                } else {
                    const first = { id: Date.now(), name: "Standard CV", data: JSON.parse(JSON.stringify(initialContent)) };
                    setDoc(cvDoc, { cvs: [first] });
                }
            });
        }

        window.saveToCloud = async () => {
            if (!auth.currentUser) return;
            const cvDoc = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'cv_data', 'main');
            await setDoc(cvDoc, { cvs: window.state.cvs });
        };

        // --- UI LOGIC ---
        window.switchView = (v) => {
            window.state.currentView = v;
            document.getElementById('resume-container').classList.toggle('hidden', v !== 'cv');
            document.getElementById('tracker-container').classList.toggle('hidden', v !== 'tracker');
            render();
        };

        window.toggleEditMode = () => {
            window.state.editMode = !window.state.editMode;
            document.getElementById('edit-toggle').innerText = window.state.editMode ? 'Edit Mode: ON' : 'Edit Mode: OFF';
            document.getElementById('formatting-toolbar').classList.toggle('hidden', !window.state.editMode);
            render();
        };

        window.format = (c, v=null) => { document.execCommand(c, false, v); window.saveCurrentEdit(); };

        window.applyStyle = (s, v) => {
            const sel = window.getSelection();
            if (!sel.rangeCount || sel.isCollapsed) return;
            const span = document.createElement('span');
            span.style[s] = v;
            span.appendChild(sel.getRangeAt(0).extractContents());
            sel.getRangeAt(0).insertNode(span);
            window.saveCurrentEdit();
        };

        window.applyBubble = () => {
            const sel = window.getSelection();
            const span = document.createElement('span');
            span.className = 'cv-bubble';
            span.textContent = sel.toString();
            sel.getRangeAt(0).deleteContents();
            sel.getRangeAt(0).insertNode(span);
            span.after(document.createTextNode('\u00A0'));
            window.saveCurrentEdit();
        };

        window.saveCurrentEdit = () => {
            const act = document.activeElement;
            if (act && act.hasAttribute('data-key')) {
                const cv = window.state.cvs.find(c => c.id === window.state.currentCVID);
                cv.data[window.state.currentLang][act.getAttribute('data-key')] = act.innerHTML;
                window.saveToCloud();
            }
        };

        window.switchLanguage = (l) => { window.state.currentLang = l; render(); };
        window.switchCV = (id) => { window.state.currentCVID = id; render(); };

        window.addNewCV = () => {
            const name = prompt("Name:");
            if (!name) return;
            const cur = window.state.cvs.find(c => c.id === window.state.currentCVID);
            window.state.cvs.push({ id: Date.now(), name, data: JSON.parse(JSON.stringify(cur.data)) });
            window.saveToCloud();
        };

        window.deleteCurrentCV = () => {
            if (window.state.cvs.length > 1 && confirm("Delete?")) {
                window.state.cvs = window.state.cvs.filter(c => c.id !== window.state.currentCVID);
                window.state.currentCVID = window.state.cvs[0].id;
                window.saveToCloud();
            }
        };

        window.showImportModal = () => document.getElementById('import-modal').classList.remove('hidden');
        window.hideImportModal = () => document.getElementById('import-modal').classList.add('hidden');

        window.copySchemaPrompt = () => {
            const p = `Act as an expert CV Tailoring AI. NO CITATIONS. Output ONLY RAW JSON.
1. EXPERTISE: Wrap in <span class="cv-bubble">Skill</span>.
2. FONT: Wrap body text in <span style="font-size: 14px;">.
3. TECH: <li class="flex justify-between text-sm"><span>Skill</span><span class="text-slate-400">Level</span></li>.
4. EDUCATION: Use layout (h3 Institution, span Date, p Degree).`;
            navigator.clipboard.writeText(p); alert("Prompt Copied.");
        };

        window.handleAIImport = () => {
            try {
                const d = JSON.parse(document.getElementById('ai-json-input').value);
                const n = prompt("Name:");
                if (!n) return;
                const base = JSON.parse(JSON.stringify(initialContent));
                window.state.cvs.push({ id: Date.now(), name: n, data: { en: {...base.en, ...d.en}, he: {...base.he, ...d.he} } });
                window.saveToCloud();
                hideImportModal();
            } catch (e) { alert("Invalid JSON"); }
        };

        function render() {
            const cont = document.getElementById('resume-container');
            const cv = window.state.cvs.find(c => c.id === window.state.currentCVID);
            if (!cv) return;
            const d = cv.data[window.state.currentLang];
            const isHe = window.state.currentLang === 'he';
            const edit = window.state.editMode ? 'contenteditable="true"' : '';

            document.getElementById('cv-tabs').innerHTML = window.state.cvs.map(c => `<button onclick="switchCV(${c.id})" class="text-xs transition px-2 ${c.id === window.state.currentCVID ? 'tab-active' : 'text-gray-400'}">${c.name}</button>`).join('');

            cont.innerHTML = `
                <div class="resume-page ${isHe ? 'hebrew-font' : ''}" dir="${isHe ? 'rtl' : 'ltr'}">
                    <header class="border-b-4 border-slate-800 pb-6 mb-8 flex justify-between items-start">
                        <div class="flex-1">
                            <h1 class="text-4xl font-bold" ${edit} data-key="name" oninput="window.saveCurrentEdit()">${d.name}</h1>
                            <p class="text-xl text-slate-600 font-medium uppercase" ${edit} data-key="title" oninput="window.saveCurrentEdit()">${d.title}</p>
                        </div>
                        <div class="text-sm text-slate-500" ${edit} data-key="contact_info" oninput="window.saveCurrentEdit()">${d.contact_info}</div>
                    </header>
                    <div class="grid grid-cols-12 gap-8">
                        <div class="col-span-8">
                            <section class="mb-8">
                                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Profile</h2>
                                <p class="text-slate-700 leading-relaxed" ${edit} data-key="profile" oninput="window.saveCurrentEdit()">${d.profile}</p>
                            </section>
                            <section class="mb-8">
                                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Experience</h2>
                                <div class="mb-6"><h3 class="font-bold text-lg">User1st</h3><ul class="list-disc ml-4 text-sm" ${edit} data-key="user1st_points" oninput="window.saveCurrentEdit()">${d.user1st_points}</ul></div>
                            </section>
                            <section class="mb-8 pt-6 border-t">
                                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Education</h2>
                                <div ${edit} data-key="education" oninput="window.saveCurrentEdit()">${d.education}</div>
                            </section>
                        </div>
                        <div class="col-span-4 bg-slate-50 p-6 rounded-lg h-fit">
                            <section class="mb-8"><h2 class="text-xs font-bold text-slate-400 uppercase mb-4">Expertise</h2><div class="flex flex-wrap gap-1" ${edit} data-key="expertise" oninput="window.saveCurrentEdit()">${d.expertise}</div></section>
                            <section class="mb-8"><h2 class="text-xs font-bold text-slate-400 uppercase mb-4">Tech Stack</h2><div ${edit} data-key="tech_stack" oninput="window.saveCurrentEdit()">${d.tech_stack}</div></section>
                            <section><h2 class="text-xs font-bold text-slate-400 uppercase mb-4">Languages</h2><div ${edit} data-key="languages" oninput="window.saveCurrentEdit()">${d.languages}</div></section>
                        </div>
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
